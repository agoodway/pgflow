services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '54323:5432'
    environment:
      POSTGRES_DB: pgflow_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
    command: postgres -c cron.database_name=pgflow_test
