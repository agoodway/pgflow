services:
  db:
    image: jumski/atlas-postgres-pgflow:17.6.1.054
    ports:
      - '54323:5432'
    environment:
      POSTGRES_DB: pgflow_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - cron.database_name=pgflow_test
      - -c
      - cron.timezone=America/New_York
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
# Note: the pgflow schema is no longer pre-loaded via a SQL init script.
# `test/test_helper.exs` bootstraps it via `PgFlow.Migration.up/0` +
# `PgFlow.HelpersMigration.up/0`, which is the same path consumers
# take in production.
#
# Upstream harness pgTAP suite (--suite pgtap) requires the pgtap extension package on
# the Postgres host. The atlas image may not include it by default; run
# `test/support/db/install-pgtap.sh` after `docker compose up -d` when apt is available
# in the container. Without postgresql-*-pgtap the harness fails loudly (no silent skip).
